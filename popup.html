<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <title>IP Guard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2 class="header-title">🛡️IP Guard</h2>

<div id="status" class="status status-ready">Ready to check</div>

<div class="info-box">
    <div class="info-box-label">Your IP Address</div>
    <div id="ip" class="ip-address">---</div>
</div>

<div class="details">
    <div class="detail-row">
        <span class="detail-label">Country:</span>
        <span id="country" class="detail-value">---</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">City:</span>
        <span id="city" class="detail-value">---</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">ISP:</span>
        <span id="isp" class="detail-value">---</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Type:</span>
        <span id="type" class="detail-value">---</span>
    </div>
</div>

<button id="check-btn" class="check-btn">Check IP Now</button>

<div class="footer">
    Made with ❤️ by
    <a href="https://github.com/AbolfazlTafakori" target="_blank">ABOLFAZL</a>
</div>

<script src="popup.js"></script>
</body>
</html>
