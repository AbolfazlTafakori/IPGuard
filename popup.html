<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <title>IP Guard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h2>🛡️ IP Guard</h2>

<div id="status" class="status">Ready</div>

<div class="info-box">
    <div class="label">Your IP Address</div>
    <div id="ip" class="ip-address">---</div>
</div>

<div class="details">
    <div><span class="label">Country:</span> <span id="country">---</span></div>
    <div><span class="label">City:</span> <span id="city">---</span></div>
    <div><span class="label">ISP:</span> <span id="isp">---</span></div>
    <div><span class="label">Type:</span> <span id="type">---</span></div>
</div>

<button id="check-btn">Check IP Now</button>

<!-- Personal Signature -->

<script src="popup.js"></script>
</body>
</html>
